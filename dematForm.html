<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demat Account Opening Form</title>
    <link rel="stylesheet" href="demat.css"> <!-- Link to your CSS file -->
</head>
<body>
    <header>
        <div class="header-content">
            <a href="formSuccess.html"></a>
            <h1>Open Your Demat Account</h1>
            <p class="header-quote">Your journey to financial empowerment starts here!</p>
        </div>
    </header>
    
    <main>
        <div class="demat-form-section">
            <h2>Demat Account Application Form</h2>
            <form action="/submitForm" method="post" enctype="multipart/form-data"> <!-- Action points to the controller route -->
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label for="address">Residential Address:</label>
                    <textarea id="address" name="address" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="pan">PAN Number:</label>
                    <input type="text" id="pan" name="pan" required>
                </div>
                <div class="form-group">
                    <label for="aadhar">Aadhar Number:</label>
                    <input type="text" id="aadhar" name="aadhar" required>
                </div>
                <div class="form-group">
                    <label for="documents">Upload Documents:</label>
                    <input type="file" id="documents" name="documents" multiple>
                </div>
                <button type="submit" class="submit-button">Submit Application</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Demat Direct. All rights reserved.</p>
    </footer>
    <script>
        document.getElementById("login-form").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent the actual form submission
            window.location.href = "formSuccess.html"; // Redirect to the success page
        });
    </script>
    
</body>
</html>
